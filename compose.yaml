services:
  adapter:
    image: ghcr.io/h2oking89/abs-audiobookdb:latest
    pull_policy: always
    user: "99:100"
    environment:
      AUDIOBOOKDB_CONTACT: "${AUDIOBOOKDB_CONTACT:?Set operator contact}"
      GOMEMLIMIT: 192MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      shared:
        aliases: [adapter]

networks:
  shared:
    external: true
    name: "${DOCKER_NETWORK:?Set the network shared with ABS}"
