name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false # Standard library only; no go.sum exists.
      - name: Repository syntax and documentation links
        run: python3 .github/scripts/check_repository.py
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o bin/abs-audiobookdb ./cmd/abs-audiobookdb

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t abs-audiobookdb:ci .
      - name: Container health and shutdown without upstream access
        shell: bash
        run: |
          container_id=$(docker run -d --network none --read-only --memory 256m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e AUDIOBOOKDB_CONTACT=ci@example.invalid abs-audiobookdb:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          healthy=false
          for _ in $(seq 1 30); do
            if docker exec "$container_id" /adapter health >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 0.2
          done
          test "$healthy" = true
          docker stop -t 10 "$container_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 0
